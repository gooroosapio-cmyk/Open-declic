<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" role="img" aria-label="chargement-points"><style>.od-dot{animation:odDots 1.2s ease-in-out infinite}@keyframes odDots{0%,75%,100%{opacity:.3}35%{opacity:1}}@media(prefers-reduced-motion:reduce){.od-float,.od-pulse,.od-spin,.od-check,.od-dot,.od-shine{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><g transform="" class=""><circle cx="112" cy="150" r="11" fill="#F45B4B" class="od-dot" style="animation-delay:0.0s"/><circle cx="160" cy="150" r="11" fill="#F45B4B" class="od-dot" style="animation-delay:0.16s"/><circle cx="208" cy="150" r="11" fill="#F45B4B" class="od-dot" style="animation-delay:0.32s"/></g></svg>